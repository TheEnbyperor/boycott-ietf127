kind: ConfigMap
apiVersion: v1
metadata:
  name: boycott-ietf127
  namespace: q-personal
data:
  HOST: "boycott-ietf127.org"
  DJANGO_SETTINGS_MODULE: "boycott_ietf_127.settings"
  EXTERNAL_URL: "https://boyctot-ietf127.org"
  DB_HOST: "cockroachdb.default"
  DB_NAME: "boycott_ietf127"
  S3_ENDPOINT: "https://s3.as207960.net"
  S3_REGION: "garage"
  S3_BUCKET: "boycott-ietf127-django"
  S3_ACCESS_KEY_ID: "GKe590fc097b6708821324d31c"
  S3_CUSTOM_DOMAIN: "boycott-ietf127-django.content.as207960.net"
  STATIC_URL: "https://boycott-ietf127-django.content.as207960.net/"
  MEDIA_URL: "https://boycott-ietf127-django.content.as207960.net/"
  PKPASS_ORGANIZATION_NAME: "VDV PKPass"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boycott-ietf127-django
  namespace: q-personal
  labels:
    app: boycott-ietf127
    part: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boycott-ietf127
      part: django
  template:
    metadata:
      annotations:
        cni.projectcalico.org/ipv6pools: "[\"default-ipv6-ippool\"]"
      labels:
        app: boycott-ietf127
        part: django
    spec:
      initContainers:
        - name: django
          image: theenbyperor/boycott-ietf127:(version)
          imagePullPolicy: Always
          command: ["sh", "-c", "python3 manage.py collectstatic --noinput && python3 manage.py migrate"]
          envFrom: &envFrom
            - configMapRef:
                name: boycott-ietf127
            - secretRef:
                name: boycott-ietf127-db-creds
              prefix: "DB_"
            - secretRef:
                name: boycott-ietf127-email
              prefix: "EMAIL_"
            - secretRef:
                name: boycott-ietf127-django-secret
            - secretRef:
                name: boycott-ietf127-s3
      containers:
        - name: gunicorn
          image: theenbyperor/boycott-ietf127:(version)
          imagePullPolicy: Always
          command: ["gunicorn", "-w", "4", "-b", "[::]:8000", "--forwarded-allow-ips", "*", "--access-logfile", "-", "--log-level=debug", "--timeout=90", "boycott_ietf_127.wsgi:application"]
          volumeMounts: *volumeMounts
          ports:
            - containerPort: 8000
          envFrom: *envFrom
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: boycott-ietf127-django
  namespace: q-personal
spec:
  podSelector:
    matchLabels:
      app: boycott-ietf127
      part: django
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              role: metrics
      ports:
        - protocol: TCP
          port: 8000